<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkMemory</title>
  <!-- Modern premium typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-area">
        <img class="logo-img" src="icons/icon48.png" alt="LinkMemory Logo">
        <h1>Link<span>Memory</span></h1>
      </div>
      <div class="app-badge">v4.0.0</div>
    </header>

    <!-- General Settings global switch -->
    <section class="hiding-settings-section" style="padding: 12px; margin-bottom: 12px;">
      <div class="hiding-toggle-row" style="border-bottom: none; padding-bottom: 0;">
        <span class="toggle-label" style="font-size: 13px;">Enable LinkMemory</span>
        <label class="switch">
          <input type="checkbox" id="toggle-enabled" checked>
          <span class="slider round"></span>
        </label>
      </div>
    </section>

    <!-- Stats Dashboard -->
    <section class="dashboard-section">
      <div class="stats-grid">
        <div class="stat-card green" style="border-color: rgba(34, 197, 94, 0.2);">
          <span class="stat-label">Total Titles</span>
          <span class="stat-value" id="stat-total-count">0</span>
        </div>
        <div class="stat-card red" style="border-color: rgba(255, 59, 48, 0.2);">
          <span class="stat-label">Matched On Page</span>
          <span class="stat-value" id="stat-matched-page-count">0</span>
        </div>
      </div>
      
      <!-- Meta Information -->
      <div class="meta-row" style="margin-bottom: 8px;">
        <div class="meta-item">
          <span>Database Size: </span><strong id="stat-db-size">0 KB</strong>
        </div>
        <div class="meta-item">
          <span>Scope Status: </span><strong id="stat-scope-status" style="color: var(--accent-green);">All Websites</strong>
        </div>
      </div>
    </section>

    <!-- Actions Section -->
    <section class="actions-section">
      <!-- Database controls group -->
      <div class="db-group">
        <div class="db-group-title">Title Database Manager</div>
        <div class="action-row">
          <button class="btn btn-secondary btn-sm" id="btn-toggle-bulk-paste" style="flex: 1;">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
            Paste Titles
          </button>
          
          <button class="btn btn-secondary btn-sm" id="btn-open-settings" style="flex: 1;">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            Full Settings
          </button>
        </div>
        
        <!-- Bulk Paste Area -->
        <div class="bulk-paste-container" id="bulk-paste-container" style="display: none; margin-top: 8px;">
          <textarea id="bulk-paste-textarea" placeholder="Paste article titles here (one per line)..."></textarea>
          <div class="bulk-paste-actions">
            <button class="btn btn-green btn-xs" id="btn-import-bulk-paste">Import Titles</button>
            <button class="btn btn-secondary btn-xs" id="btn-clear-bulk-paste">Clear</button>
          </div>
        </div>
        
        <!-- Title Import Progress -->
        <div class="import-progress-container" id="import-progress-titles" style="display: none; margin-top: 8px;">
          <div class="progress-bar-track">
            <div class="progress-bar-fill" id="progress-fill-titles" style="width: 0%;"></div>
          </div>
          <div class="progress-status-row">
            <span class="progress-status-text" id="progress-status-titles">Ready</span>
            <span class="progress-status-pct" id="progress-pct-titles">0%</span>
          </div>
        </div>
      </div>
      
      <!-- Feedback Messages -->
      <div class="feedback-toast" id="feedback-message"></div>
    </section>

    <!-- Footer build brand -->
    <footer class="app-footer" style="flex-direction: column; gap: 8px; align-items: center; justify-content: center; padding-top: 8px; margin-top: 4px;">
      <div style="font-size: 11px; color: var(--text-muted);">
        Build By <a href="https://x.com/ask_rohitsen" target="_blank" style="color: var(--accent-green); text-decoration: none; font-weight: 600;">@ask_rohitsen</a>
      </div>
    </footer>

  </div>

  <!-- Loading Scripts -->
  <script src="utils.js"></script>
  <script src="storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
